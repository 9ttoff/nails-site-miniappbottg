<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — Сахарок_nails</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --accent-pink: #FF85A1;
            --text-dark: #333333;
            --text-muted: #6C757D;
            --border-color: #E9ECEF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1, h2 {
            color: #212529;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        input[type="date"], input[type="time"] {
            padding: 10px;
            border: 1px solid #CED4DA;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background: #F1F3F5;
            color: var(--text-muted);
        }

        .status-msg {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .loading {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💅 Панель управления Сахарок_nails</h1>

    <!-- Форма добавления окна -->
    <div class="card">
        <h2>➕ Добавить новое окно</h2>
        <div class="form-group">
            <input type="date" id="slotDate">
            <input type="time" id="slotTime" value="12:00">
            <button onclick="addSlot()">Добавить окно</button>
        </div>
        <div id="addStatus" class="status-msg"></div>
    </div>

    <!-- Таблица свободных слотов -->
    <div class="card">
        <h2>📅 Открытые окна для записи</h2>
        <button onclick="loadAvailableSlots()" style="background:#6C757D; margin-bottom: 10px;">🔄 Обновить список</button>
        <div id="slotsContainer">
            <p class="loading">Загрузка окон...</p>
        </div>
    </div>

    <!-- Таблица записей клиентов -->
    <div class="card">
        <h2>📋 Активные записи клиентов</h2>
        <button onclick="loadBookings()" style="background:#6C757D; margin-bottom: 10px;">🔄 Обновить записи</button>
        <div id="bookingsContainer">
            <p class="loading">Загрузка записей...</p>
        </div>
    </div>
</div>

<script>
    // Устанавливаем сегодняшнюю дату по умолчанию
    document.getElementById('slotDate').valueAsDate = new Date();

    // 1. Функция добавления окна
    async function addSlot() {
        const date = document.getElementById('slotDate').value;
        const time = document.getElementById('slotTime').value;
        const statusEl = document.getElementById('addStatus');

        if (!date || !time) {
            statusEl.style.color = "red";
            statusEl.innerText = "❌ Выберите дату и время!";
            return;
        }

        statusEl.style.color = "gray";
        statusEl.innerText = "Сохранение...";

        try {
            const res = await fetch("/api/admin/add-slot", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ date: date, time: time })
            });

            if (res.ok) {
                statusEl.style.color = "green";
                statusEl.innerText = "✅ Окно успешно добавлено!";
                loadAvailableSlots(); // Обновляем список окон
            } else {
                const err = await res.json();
                statusEl.style.color = "red";
                statusEl.innerText = "❌ Ошибка: " + (err.detail || "Не удалось добавить");
            }
        } catch (err) {
            console.error("Ошибка при добавлении:", err);
            statusEl.style.color = "red";
            statusEl.innerText = "❌ Ошибка соединения с сервером";
        }
    }

    // 2. Загрузка всех свободных слотов
    async function loadAvailableSlots() {
        const container = document.getElementById('slotsContainer');
        container.innerHTML = '<p class="loading">Загрузка окон...</p>';

        try {
            const res = await fetch("/api/admin/all-slots");
            if (!res.ok) throw new Error("Сервер ответил с ошибкой " + res.status);
            
            const data = await res.json();
            const slots = data.slots || [];

            if (slots.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">Нет открытых окон для записи.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Время</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            slots.forEach(s => {
                html += `
                    <tr>
                        <td><b>${s.date}</b></td>
                        <td>${s.time}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (err) {
            console.error("Ошибка загрузки слотов:", err);
            container.innerHTML = '<p style="color:red;">❌ Ошибка загрузки свободных окон.</p>';
        }
    }

    // 3. Загрузка всех бронирований
    async function loadBookings() {
        const container = document.getElementById('bookingsContainer');
        container.innerHTML = '<p class="loading">Загрузка записей...</p>';

        try {
            const res = await fetch("/api/admin/bookings");
            if (!res.ok) throw new Error("Сервер ответил с ошибкой " + res.status);

            const data = await res.json();
            const bookings = data.bookings || [];

            if (bookings.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">Записей пока нет.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Дата / Время</th>
                            <th>Услуга</th>
                            <th>Клиент</th>
                            <th>Телефон</th>
                            <th>Telegram</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            bookings.forEach(b => {
                html += `
                    <tr>
                        <td><b>${b.date}</b> в ${b.time}</td>
                        <td>${b.service_name} (${b.price} ₽)</td>
                        <td>${b.user_name}</td>
                        <td>${b.phone}</td>
                        <td>${b.telegram_username || '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (err) {
            console.error("Ошибка загрузки записей:", err);
            container.innerHTML = '<p style="color:red;">❌ Ошибка загрузки записей клиентов.</p>';
        }
    }

    // Автоматическая загрузка при открытии страницы
    loadAvailableSlots();
    loadBookings();
</script>

</body>
</html>
